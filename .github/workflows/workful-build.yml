name: Workful CI Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  workful-android-build:
    name: Workful Clean Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Secrets Configuration
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Archive APKs
        uses: actions/upload-artifact@v4
        with:
          name: workful-apk-output
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

